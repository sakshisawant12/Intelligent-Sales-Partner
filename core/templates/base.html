<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Intelligent Sales Partner{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 text-white flex flex-col">

<!-- NAVBAR -->
<nav class="flex justify-between items-center px-10 py-6">
    <h1 class="text-xl font-bold tracking-wide">
        Intelligent Sales Partner
    </h1>

    <div class="flex gap-8 items-center">
    <a href="{% url 'home' %}" class="hover:text-orange-400">Home</a>
    <a href="{% url 'features' %}" class="hover:text-orange-400">Features</a>
    <a href="{% url 'about' %}" class="hover:text-orange-400">About</a>
    <a href="{% url 'contact' %}" class="hover:text-orange-400">Contact</a>
    
    {% if user.is_authenticated %}
    <a href="/dashboard/" class="bg-orange-500 px-4 py-2 rounded-lg">Dashboard</a>

    <form action="{% url 'logout' %}" method="post" class="inline">
        {% csrf_token %}
        <button type="submit" class="bg-gray-700 px-4 py-2 rounded-lg">
            Logout
        </button>
    </form>
    {% else %}
    <a href="/accounts/login/" class="bg-orange-500 px-4 py-2 rounded-lg">Login</a>
    {% endif %}
</div>

</nav>

<!-- PAGE CONTENT -->
<main class="flex-grow">
    {% block content %}{% endblock %}
</main>

<!-- FOOTER -->
<footer class="border-t border-slate-700 px-10 py-8 text-slate-400 text-sm">
    <div class="flex justify-between flex-wrap gap-6">
        <p>© 2026 Intelligent Sales Partner. All rights reserved.</p>
        <p>AI that works for your business 24/7</p>
    </div>
</footer>

</body>
</html>
