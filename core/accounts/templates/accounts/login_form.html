<!DOCTYPE html>
<html>
<head>
    <title>Sign In</title>
    <style>
        body {
            background: linear-gradient(135deg, #ff9966, #ff5e62);
            font-family: Arial;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            background: white;
            padding: 50px;
            width: 400px;
            border-radius: 16px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 12px 0;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        button {
            background: #ff7a18;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            font-size: 16px;
            border-radius: 8px;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Account Details</h2>

    <form method="post">
        {% csrf_token %}
        <input type="email" placeholder="Email" required>
        <input type="password" placeholder="Password" required>

        <button type="submit">Login</button>
    </form>
</div>

</body>
</html>
