<!DOCTYPE html>
<html lang="en">
<head>
  <title>Set New Password | Intelligent Sales Partner</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-[#0b1220] min-h-screen flex items-center justify-center text-white">

<div class="bg-[#0f172a] p-8 rounded-xl w-[420px] shadow-lg">

  <h2 class="text-2xl font-bold text-center mb-2">
    Set New Password
  </h2>

  <p class="text-sm text-gray-400 text-center mb-6">
    Create a strong password to secure your account
  </p>

  <form method="post" id="resetForm" class="space-y-4">
    {% csrf_token %}

    <!-- New Password -->
    <div>
      <label class="text-sm text-gray-300 mb-1 block">
        New Password
      </label>
      <input
        type="password"
        id="password1"
        name="new_password1"
        required
        class="w-full px-3 py-2 rounded bg-[#020617] border border-gray-700 text-white focus:outline-none focus:border-orange-500"
      />
    </div>

    <!-- Confirm Password -->
    <div>
      <label class="text-sm text-gray-300 mb-1 block">
        Confirm Password
      </label>
      <input
        type="password"
        id="password2"
        name="new_password2"
        required
        class="w-full px-3 py-2 rounded bg-[#020617] border border-gray-700 text-white focus:outline-none focus:border-orange-500"
      />
      <p id="matchError" class="text-xs text-red-400 hidden mt-1">
        Passwords do not match
      </p>
    </div>

    <!-- Password Rules (Horizontal) -->
    <div class="text-xs mt-2 flex flex-wrap gap-2">
      <span id="rule-length" class="text-red-400">8+ chars</span>
      <span id="rule-upper" class="text-red-400">Uppercase</span>
      <span id="rule-lower" class="text-red-400">Lowercase</span>
      <span id="rule-number" class="text-red-400">Number</span>
      <span id="rule-special" class="text-red-400">Special</span>
    </div>

    <!-- General error -->
    <p id="formError" class="text-xs text-red-400 hidden">
      Please fix password requirements
    </p>

    <!-- Submit -->
    <button
      type="submit"
      class="w-full mt-2 bg-orange-500 hover:bg-orange-600 py-2 rounded font-semibold transition"
    >
      Update Password
    </button>

  </form>
</div>

<script>
const p1 = document.getElementById("password1");
const p2 = document.getElementById("password2");
const form = document.getElementById("resetForm");

const rules = {
  length: document.getElementById("rule-length"),
  upper: document.getElementById("rule-upper"),
  lower: document.getElementById("rule-lower"),
  number: document.getElementById("rule-number"),
  special: document.getElementById("rule-special"),
};

const matchError = document.getElementById("matchError");
const formError = document.getElementById("formError");

function toggle(el, valid) {
  el.classList.toggle("text-green-400", valid);
  el.classList.toggle("text-red-400", !valid);
}

p1.addEventListener("input", () => {
  const v = p1.value;

  toggle(rules.length, v.length >= 8);
  toggle(rules.upper, /[A-Z]/.test(v));
  toggle(rules.lower, /[a-z]/.test(v));
  toggle(rules.number, /[0-9]/.test(v));
  toggle(rules.special, /[!@#$%^&*(),.?":{}|<>]/.test(v));
});

p2.addEventListener("input", () => {
  matchError.classList.toggle("hidden", p1.value === p2.value);
});

form.addEventListener("submit", (e) => {
  const v = p1.value;

  const valid =
    v.length >= 8 &&
    /[A-Z]/.test(v) &&
    /[a-z]/.test(v) &&
    /[0-9]/.test(v) &&
    /[!@#$%^&*(),.?":{}|<>]/.test(v) &&
    v === p2.value;

  if (!valid) {
    e.preventDefault();
    formError.classList.remove("hidden");
  }
});
</script>

</body>
</html>
