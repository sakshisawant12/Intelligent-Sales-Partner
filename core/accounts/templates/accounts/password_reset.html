<!DOCTYPE html>
<html>
<head>
  <title>Reset Password | Intelligent Sales Partner</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0b1220] flex items-center justify-center min-h-screen text-white">

<div class="bg-[#0f172a] p-8 rounded-xl w-[380px] text-center">
  <h2 class="text-2xl font-bold mb-2">Reset your password</h2>
  <p class="text-gray-400 mb-6">Enter your email to receive a reset link</p>

  <form method="post">
    {% csrf_token %}
    {{ form.email }}

    <button class="w-full mt-4 bg-orange-500 py-2 rounded">
      Send reset link
    </button>
  </form>
</div>

</body>
</html>
